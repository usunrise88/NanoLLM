# NanoLLM — annotated reference configuration (SPEC §8).
#
# `nanollm init` writes a shorter file with real keys; this one lists every
# section with its default. Unknown keys are a startup error, not a warning.
#
# Precedence: flags > NANOLLM_* env > this file > defaults. Every scalar and
# list key has an environment override named after its path:
# server.addr -> NANOLLM_SERVER_ADDR, api.dialects -> NANOLLM_API_DIALECTS
# (comma-separated). NANOLLM_AUTH_KEYS takes comma-separated secrets.

server:
  addr: 127.0.0.1:8080
  data_dir: /var/lib/nanollm
  max_body: 16777216      # bytes; 16 MiB

auth:
  mode: apikey            # open allowed only on loopback
  keys:
    - {name: admin, secret: sk-nanollm-replace-me-admin, admin: true, interactive: true}
    - {name: user,  secret: sk-nanollm-replace-me-user, rps: 10}

api:
  dialects: [openai, native]   # + ollama in v2

backends:
  lib_dir: ./lib          # ggml backends and optional onnxruntime-genai; relative to the binary
  enabled: [llamacpp]     # + ortgenai, mlx

devices:
  default: auto           # auto | cpu | gpu | npu | llamacpp:vulkan0 ...
  fallback: true
  cpu_threads: 0          # 0 = physical cores
  cpu_threads_batch: 0    # prompt processing; 0 = cpu_threads
  numa: auto              # auto | off | interleave | node:N (several-node machines)

models:
  default: gemma-4-e4b-qat
  preload: [gemma-4-e4b-qat]
  overrides:
    gemma-4-e4b-qat:
      preset: vram-3g     # SPEC §4; or mode: + explicit placement
      mode: auto          # auto = planner picks M1..M9 within the preset
      kv_type: f16        # f16 | q8_0
      n_ctx: auto         # auto = what the preset leaves, floor 4096
      slots: auto
      speculative:
        type: mtp         # mtp | none
        n_max: 2
        p_min: 0.0

pool:
  max_resident_models: 1
  max_pending: 64         # requests waiting for a slot, per model; the next gets 503 queue_full (0 = no limit)

cache:
  prompt: true
  max_snapshots: 8        # Qwen3.5 fallback only
  # Prompt cache on disk (OPT-13). The state of a prompt that has just been
  # prefilled is saved, and a request that starts with that prompt gets it
  # back after a restart or after its slot was reused, instead of a prefill.
  # Off by default; when off, no directory is created. It needs prompt: true.
  # A state is ~16 KiB per token with the KV cache in f16 (E4B), plus the
  # sliding-window layers: up to ~40 KiB per token more with swa_full.
  prompt_disk: false
  prompt_dir: ""          # empty = <data_dir>/promptcache
  prompt_max_bytes: 2147483648   # 2 GiB; the least recently used states go first
  prompt_min_tokens: 256  # shorter prompts are not saved; a restore must gain half of it

generation:
  enable_thinking: false
  max_tokens_cap: 8192
  context_overflow: error # error | truncate_middle

queue:
  enabled: true
  max_pending: 1000       # queued + running jobs; beyond it POST /api/v1/jobs answers 503
  concurrency: 4          # lines of the running job in flight at once
  webhook_secret: ""      # HMAC-SHA256 key for webhook signatures; empty = unsigned
  retention_days: 30      # finished jobs older than this are deleted (0 = keep)

registry:
  models_dir: ""          # default <data_dir>/models
  strict_license: false
  catalog_url: ""
  mirrors: []

bench:
  submit: ask             # ask | never — results are sent only after you see them
  submit_url: https://nano.llmto.day
  anonymous: false        # true: a throwaway key, not withdrawable

ui:
  enabled: true

log:
  level: info             # debug | info | warn | error
  format: json            # json | text
  file: ""                # append here (rolled at 64 MiB) instead of stderr; the Windows service and the launchd agent set it
