version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - noctx        # every outbound call carries a context: model downloads
                   # must be cancellable with the request
    - rowserrcheck
    - unconvert
    - wastedassign

  settings:
    errcheck:
      # Close() on a read-only handle in a defer is noise, not a finding.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        # Terminal output: a failed write to stdout or stderr has nowhere
        # better to be reported.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose, noctx]

formatters:
  enable:
    - gofmt
