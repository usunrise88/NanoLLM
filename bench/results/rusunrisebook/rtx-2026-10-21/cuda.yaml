# the n7 libraries without ggml-vulkan.dll plus the windows_amd64_cuda add-on (CUDA 12.4, upstream b11600).
server:
  addr: "127.0.0.1:8091"
  data_dir: 'C:\ProgramData\NanoLLM'
auth:
  mode: open
