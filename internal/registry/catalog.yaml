# One model for now: Gemma 4 E4B QAT int4 with its MTP drafter, both from
# Unsloth. Gemma 4 12B and Qwen3.5-9B return when work on them does
# (docs/ROADMAP.md, deferred).
#
# Every file is pinned to a repository commit, its size and its sha256 (the
# LFS object id); the registry refuses to download a file that is not. The
# drafter is the repository-root file, Unsloth's recommended "smart Q4_0"
# (also published as MTP/mtp-gemma-4-E4B-it-Q4_0.gguf).
#
# Multimodal projectors (mmproj) are not downloaded in v1.

