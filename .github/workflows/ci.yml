name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
      # -race needs cgo; the shipped binary does not.
      - run: CGO_ENABLED=1 go test -race ./...
      - name: cross-compile every release target with CGO_ENABLED=0
        run: make cross VERSION=${GITHUB_REF_NAME}
      - name: smoke test
        run: |
          ./dist/linux_amd64/nanollm version
          ./dist/linux_amd64/nanollm serve -addr 127.0.0.1:18080 &
          for i in $(seq 30); do
            curl -sf localhost:18080/healthz && exit 0
            sleep 1
          done
          echo "server did not come up" >&2
          exit 1

  # benchfmt is its own module (it moves out with the benchmark service), so
  # the root ./... does not reach it.
  benchfmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchfmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchfmt/go.mod
      - run: go vet ./...
      - run: go test ./...

  # The official OpenAI Python client against the server on the fake backend:
  # streaming, tools, logprobs, error shapes. The same suite runs against a
  # real model with NANOLLM_BASE_URL set.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/conformance/requirements.txt
      - run: make conformance

  # Unit tests on the other two platforms: path handling, the data-dir
  # defaults and library names differ per OS, and only a real runner shows it.
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          CGO_ENABLED: "0"

  # The libllama binding against the pinned release (STAGE1 1.5): the struct
  # layout per target with zig cc, the export tables of every archive (C and
  # decorated C++ names), and that zz_generated.go is what bindgen makes of
  # the tag's headers. All of it runs on one Linux runner.
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: llama.cpp sources at the pinned tag
        run: git clone --depth 1 --branch "$(tr -d '[:space:]' < scripts/llama.cpp.tag)" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
      - name: zig
        run: pip install ziglang
      - name: struct layout on every target
        run: ./scripts/check-layout.sh "$RUNNER_TEMP/llama.cpp"
      - name: generated binding is current
        run: NANOLLM_LLAMA_SRC="$RUNNER_TEMP/llama.cpp" go test -run TestGeneratedIsCurrent -v ./tools/bindgen
      - name: export tables
        run: |
          ./scripts/fetch-libs.sh "" linux_amd64 linux_arm64 windows_amd64 windows_arm64 darwin_arm64 darwin_amd64
          args=()
          for d in dist/*/lib; do args+=(-check-exports "$d"); done
          go run ./tools/bindgen -src "$RUNNER_TEMP/llama.cpp" "${args[@]}"
      # The tiny Gemma 4 target and its MTP assistant (random weights, fixed
      # seed), converted by the tag's own converter, for the native jobs.
      - name: tiny fixtures
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install transformers==5.20.1 safetensors sentencepiece protobuf
          python3 tools/fixtures/make_tiny.py --llama-cpp "$RUNNER_TEMP/llama.cpp" --out "$RUNNER_TEMP/fixtures"
          (cd "$RUNNER_TEMP/fixtures" && grep -v "^#" "$GITHUB_WORKSPACE/testdata/fixtures/tiny.sha256" | sha256sum -c) || echo "fixtures differ from testdata/fixtures/tiny.sha256: the tiny golden files will skip"
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-fixtures
          path: ${{ runner.temp }}/fixtures/*.gguf
          retention-days: 7

  # Native tests on each platform's own runner: fetch-libs for the host, then
  # the tests tagged native against the tiny fixtures the binding job made:
  # loading, tokenizer, state, grammar, KV shape, MTP mechanics and
  # equivalence, the scheduler on the real backend. The golden files apply
  # only where file hashes and the CPU variant match, and skip elsewhere.
  native:
    needs: binding
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows_amd64 }
          - { os: windows-11-arm, target: windows_arm64 }
          - { os: macos-latest, target: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libgomp for the Linux CPU backends
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgomp1
      - name: fetch-libs for the host
        shell: bash
        run: ./scripts/fetch-libs.sh "" ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: tiny-fixtures
          path: fixtures
      - name: native tests
        shell: bash
        env:
          CGO_ENABLED: "0"
          NANOLLM_TEST_LIB_DIR: ${{ github.workspace }}/dist/${{ matrix.target }}/lib
          NANOLLM_TEST_MODEL: ${{ github.workspace }}/fixtures/tiny-gemma4.gguf
          NANOLLM_TEST_DRAFTER: ${{ github.workspace }}/fixtures/tiny-gemma4-mtp.gguf
        run: go test -tags native -count=1 -v ./internal/backend/llamacpp/...
      - name: devices
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/nanollm devices -lib-dir dist/${{ matrix.target }}/lib
