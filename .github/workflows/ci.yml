name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          # The config schema check fetches golangci-lint.run and has failed
          # a run on its timeout; `make lint` keeps it locally.
          verify: false
      # -race needs cgo; the shipped binary does not.
      - run: CGO_ENABLED=1 go test -race ./...
      - name: cross-compile every release target with CGO_ENABLED=0
        run: make cross VERSION=${GITHUB_REF_NAME}
      - name: smoke test
        run: |
          ./dist/linux_amd64/nanollm version
          ./dist/linux_amd64/nanollm serve -addr 127.0.0.1:18080 &
          for i in $(seq 30); do
            curl -sf localhost:18080/healthz && exit 0
            sleep 1
          done
          echo "server did not come up" >&2
          exit 1

  # benchfmt is its own module (it moves out with the benchmark service), so
  # the root ./... does not reach it.
  benchfmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchfmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchfmt/go.mod
      - run: go vet ./...
      - run: go test ./...

  # The official OpenAI Python client against the server on the fake backend:
  # streaming, tools, logprobs, error shapes. The same suite runs against a
  # real model with NANOLLM_BASE_URL set.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/conformance/requirements.txt
      - run: make conformance

  # The SPA (STAGE1 1.8): lint, typecheck, unit tests and the production
  # build, which the e2e job embeds. A few seconds; no server needed.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # nano.llmto.day (site/): the landing page and the product pages, prerendered
  # from React. Typecheck, build, and look for what the pages must carry.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: The pages are there
        run: |
          for f in index.html nanollm/index.html nanoasr/index.html nanotts/index.html 404.html; do
            test -s "dist/$f" || { echo "dist/$f is missing or empty" >&2; exit 1; }
          done
          grep -q "No GPU required" dist/index.html
          grep -q 'href="/benchmarks"' dist/nanollm/index.html
          grep -q "github.com/usunrise88/NanoASR" dist/nanoasr/index.html
          grep -q "github.com/usunrise88/NanoTTS" dist/nanotts/index.html

  # The SPA embedded in the real binary, in Chromium, against `serve` on the
  # fake backend: one server in open mode and one demanding a key, both
  # started by playwright.config.ts. Screens whose backend lands later (jobs,
  # bench) are checked against both today's 501/404 and the planned API.
  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist
      - name: the binary embeds the SPA
        run: NANOLLM_REQUIRE_UI=1 go test -count=1 -v -run 'TestHasSPA|TestEmbeddedSPA' ./internal/ui
      - run: make build
      - run: ./dist/nanollm version | grep -E '^ui +true$'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          NANOLLM_BIN: ${{ github.workspace }}/dist/nanollm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: web/test-results

  # Unit tests on the other two platforms: path handling, the data-dir
  # defaults and library names differ per OS, and only a real runner shows it.
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          CGO_ENABLED: "0"

  # The libllama binding against the pinned release (STAGE1 1.5): the struct
  # layout per target with zig cc, the export tables of every archive (C and
  # decorated C++ names), and that zz_generated.go is what bindgen makes of
  # the tag's headers. All of it runs on one Linux runner.
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: llama.cpp sources at the pinned tag
        run: git clone --depth 1 --branch "$(tr -d '[:space:]' < scripts/llama.cpp.tag)" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
      - name: zig
        run: pip install ziglang
      - name: struct layout on every target
        run: ./scripts/check-layout.sh "$RUNNER_TEMP/llama.cpp"
      - name: generated binding is current
        run: NANOLLM_LLAMA_SRC="$RUNNER_TEMP/llama.cpp" go test -run TestGeneratedIsCurrent -v ./tools/bindgen
      - name: export tables
        run: |
          ./scripts/fetch-libs.sh "" linux_amd64 linux_arm64 windows_amd64 windows_arm64 darwin_arm64 darwin_amd64
          args=()
          for d in dist/*/lib; do args+=(-check-exports "$d"); done
          go run ./tools/bindgen -src "$RUNNER_TEMP/llama.cpp" "${args[@]}"
      # The tiny Gemma 4 target and its MTP assistant (random weights, fixed
      # seed), converted by the tag's own converter, for the native jobs.
      - name: tiny fixtures
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install transformers==5.20.1 safetensors sentencepiece protobuf
          python3 tools/fixtures/make_tiny.py --llama-cpp "$RUNNER_TEMP/llama.cpp" --out "$RUNNER_TEMP/fixtures"
          (cd "$RUNNER_TEMP/fixtures" && grep -v "^#" "$GITHUB_WORKSPACE/testdata/fixtures/tiny.sha256" | sha256sum -c) || echo "fixtures differ from testdata/fixtures/tiny.sha256: the tiny golden files will skip"
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-fixtures
          path: ${{ runner.temp }}/fixtures/*.gguf
          retention-days: 7

  # Native tests on each platform's own runner: fetch-libs for the host, then
  # the tests tagged native against the tiny fixtures the binding job made:
  # loading, tokenizer, state, grammar, KV shape, MTP mechanics and
  # equivalence, the scheduler on the real backend. The golden files apply
  # only where file hashes and the CPU variant match, and skip elsewhere.
  native:
    needs: binding
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows_amd64 }
          - { os: windows-11-arm, target: windows_arm64 }
          - { os: macos-latest, target: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libgomp for the Linux CPU backends
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgomp1
      - name: fetch-libs for the host
        shell: bash
        run: ./scripts/fetch-libs.sh "" ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: tiny-fixtures
          path: fixtures
      - name: native tests
        shell: bash
        env:
          CGO_ENABLED: "0"
          NANOLLM_TEST_LIB_DIR: ${{ github.workspace }}/dist/${{ matrix.target }}/lib
          NANOLLM_TEST_MODEL: ${{ github.workspace }}/fixtures/tiny-gemma4.gguf
          NANOLLM_TEST_DRAFTER: ${{ github.workspace }}/fixtures/tiny-gemma4-mtp.gguf
        run: go test -tags native -count=1 -v ./internal/backend/llamacpp/...
      - name: devices
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/nanollm devices -lib-dir dist/${{ matrix.target }}/lib

  # The installers end to end on each OS (STAGE1 1.9), from an archive built
  # here rather than a release: install as a service, /healthz answers, an
  # upgrade in place keeps the configuration and the keys, and uninstall
  # --purge leaves nothing behind.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libgomp and the Vulkan loader
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgomp1 libvulkan1
      - name: a local archive for this machine
        id: dist
        run: |
          archive="$(UI=0 VERSION=v0.0.0-ci OUT=out ./scripts/dist.sh)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: install.sh, systemd
        if: runner.os == 'Linux'
        env:
          ARCHIVE: ${{ steps.dist.outputs.archive }}
        run: |
          set -euo pipefail
          sudo ./scripts/install.sh --archive "$ARCHIVE" --no-ui --no-download --addr 127.0.0.1:18080
          systemctl is-active nanollm
          grep -q '^LimitMEMLOCK=infinity$' /etc/systemd/system/nanollm.service
          curl -fsS 127.0.0.1:18080/healthz
          sudo /opt/nanollm/nanollm service status
          before=$(sudo sha256sum /var/lib/nanollm/nanollm.yaml)
          sudo ./scripts/install.sh --archive "$ARCHIVE" --no-ui --no-download
          [ "$before" = "$(sudo sha256sum /var/lib/nanollm/nanollm.yaml)" ] || { echo "::error::the upgrade rewrote the configuration"; exit 1; }
          curl -fsS 127.0.0.1:18080/healthz
          sudo ./scripts/install.sh --uninstall --purge
          for p in /etc/systemd/system/nanollm.service /opt/nanollm /var/lib/nanollm; do
            [ ! -e "$p" ] || { echo "::error::$p survived --purge"; exit 1; }
          done
          ! id nanollm 2>/dev/null || { echo "::error::the nanollm account survived --purge"; exit 1; }

      - name: install.sh, launchd agent
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ steps.dist.outputs.archive }}
        run: |
          set -euo pipefail
          data="$HOME/Library/Application Support/NanoLLM"
          ./scripts/install.sh --archive "$ARCHIVE" --no-ui --no-download --addr 127.0.0.1:18080
          curl -fsS 127.0.0.1:18080/healthz
          /usr/local/nanollm/nanollm service status
          before=$(shasum -a 256 "$data/nanollm.yaml")
          ./scripts/install.sh --archive "$ARCHIVE" --no-ui --no-download
          [ "$before" = "$(shasum -a 256 "$data/nanollm.yaml")" ] || { echo "::error::the upgrade rewrote the configuration"; exit 1; }
          curl -fsS 127.0.0.1:18080/healthz
          ./scripts/install.sh --uninstall --purge
          for p in "$HOME/Library/LaunchAgents/com.github.usunrise88.nanollm.plist" /usr/local/nanollm "$data"; do
            [ ! -e "$p" ] || { echo "::error::$p survived --purge"; exit 1; }
          done

      - name: install.ps1, Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.dist.outputs.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:ProgramData 'NanoLLM\nanollm.yaml'
          ./scripts/install.ps1 -Archive $env:ARCHIVE -NoDownload -Addr 127.0.0.1:18080
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          if ((Get-Service NanoLLM).Status -ne 'Running') { throw "the service is not running" }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/healthz | Select-Object -ExpandProperty Content
          & "$env:ProgramFiles\NanoLLM\nanollm.exe" service status
          $before = (Get-FileHash $config).Hash
          ./scripts/install.ps1 -Archive $env:ARCHIVE -NoDownload
          if ($LASTEXITCODE) { throw "the upgrade failed" }
          if ((Get-FileHash $config).Hash -ne $before) { throw "the upgrade rewrote the configuration" }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/healthz | Out-Null
          ./scripts/install.ps1 -Uninstall -Purge
          if (Get-Service NanoLLM -ErrorAction SilentlyContinue) { throw "the service survived -Uninstall" }
          foreach ($p in "$env:ProgramFiles\NanoLLM", "$env:ProgramData\NanoLLM") {
            if (Test-Path $p) { throw "$p survived -Purge" }
          }

  # Both container images (deploy/Dockerfile). The CPU one serves: healthy,
  # keys enforced, a reply from the tiny model. The CUDA one runs without a
  # GPU here and must fall back to the CPU and say why; on a GPU it is
  # exercised from stage 3.
  docker:
    needs: binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tiny-fixtures
          path: fixtures
      - name: build the CPU image
        run: docker build -f deploy/Dockerfile -t nanollm:ci .
      - name: build the CUDA image
        run: docker build -f deploy/Dockerfile --build-arg FLAVOUR=cuda -t nanollm:ci-cuda .
      - name: the CPU image serves
        run: |
          key=sk-ci-0123456789abcdef
          docker run -d --name nl -p 127.0.0.1:18080:8080 -e NANOLLM_AUTH_KEYS=$key nanollm:ci
          for i in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nl)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' nl | grep -qx healthy || { docker logs nl; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:18080/v1/models)
          [ "$code" = 401 ] || { echo "::error::without a key: $code, want 401"; exit 1; }
          curl -sf -H "Authorization: Bearer $key" 127.0.0.1:18080/v1/models >/dev/null
          docker rm -f nl
      - name: run --prompt on the tiny model in each image
        run: |
          for img in nanollm:ci nanollm:ci-cuda; do
            out=$(docker run --rm -v "$PWD/fixtures:/fx:ro" -e NANOLLM_AUTH_KEYS=sk-ci-0123456789abcdef \
              "$img" run --model /fx/tiny-gemma4.gguf --prompt hi -n 4 2>&1) || { echo "$out"; exit 1; }
            echo "$img: $out" | tail -3
          done
      - name: the CUDA image without a GPU falls back and says why
        run: |
          out=$(docker run --rm -e NANOLLM_AUTH_KEYS=sk-ci-0123456789abcdef nanollm:ci-cuda devices 2>&1)
          echo "$out"
          grep -q "llamacpp:cpu" <<<"$out"
          grep -qi "cuda" <<<"$out" || { echo "::error::the CUDA image does not say why CUDA is missing"; exit 1; }
