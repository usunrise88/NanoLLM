name: libs-build

# NanoLLM's own libllama and libggml-base (docs/STAGE2.md 2.1): the pinned
# llama.cpp tag plus patches/llama.cpp, built for every target from the same
# commit (scripts/build-libs.sh --prepare-only applies the series and checks its
# hash against scripts/llama.cpp.commit). ggml_commit() lives in libggml-base,
# so the commit check sees our commit.
#
# Patches 0002-0004 live in the CPU backend (ggml-cpu), so a target marked
# `cpu` in the matrix also builds the CPU backend (GGML_CPU_ALL_VARIANTS where
# upstream's release job uses it) and ships it in the same archive; a target
# without it keeps upstream's CPU backend, which runs the same model with the
# unpatched kernels. The Vulkan backend is ours on windows_amd64 (patch 0006), and so is the CUDA backend of the two
# windows_amd64_cuda* targets below (the "cuda:" patches, 0008 on); every other GPU backend is upstream's.
# fetch-libs.sh lays what the archive holds over upstream's.
#
# Published as a release of this repository, llama-<tag>-n<N> (scripts/libs.release),
# one nanollm-libs-<target>.tar.gz per target.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish the archives as a release
        type: boolean
        default: false
  push:
    paths:
      - patches/llama.cpp/**
      - scripts/llama.cpp.commit
      - scripts/llama.cpp.base
      - scripts/build-libs.sh
      - .github/workflows/libs-build.yml

permissions:
  contents: write

env:
  # What libllama and libggml-base need and nothing else: no GPU backends, no
  # tools; the CPU backend only on the targets that ship it (CPU_FLAGS below).
  CMAKE_FLAGS: >-
    -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF
    -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_TESTS=OFF
    -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cpuflags/targets: the CPU backend is part of the build (patches 0002-0004 live in it).
          # `ggml` pulls in every variant of GGML_CPU_ALL_VARIANTS (Linux and x86 only upstream),
          # `ggml-cpu` is the one library of the other targets; "all" would also build the llama app.
          # darwin_arm64 keeps upstream's CPU backend: upstream builds it without GGML_BACKEND_DL, so its
          # libggml.dylib links libggml-cpu.0.dylib, which a module of ours would not replace (n4 native test).
          - { target: linux_amd64, os: ubuntu-22.04, rpath: '$ORIGIN', cpu: true, cpuflags: '-DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON', targets: 'llama ggml-base ggml' }
          - { target: linux_arm64, os: ubuntu-24.04-arm, rpath: '$ORIGIN', extra: '-DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14', cpu: true, cpuflags: '-DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON', targets: 'llama ggml-base ggml' }
          - { target: darwin_arm64, os: macos-15, rpath: '@loader_path', extra: '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3', cpu: false, cpuflags: '-DGGML_CPU=OFF', targets: 'llama ggml-base' }
          - { target: darwin_amd64, os: macos-15-intel, rpath: '@loader_path', extra: '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3', cpu: true, cpuflags: '-DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON', targets: 'llama ggml-base ggml' }
          - { target: windows_amd64, os: windows-2025-vs2026, win: x64, cpu: true, vulkan: true, cpuflags: '-DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_VULKAN=ON', targets: 'llama ggml-base ggml ggml-vulkan' }
          - { target: windows_arm64, os: windows-2025-vs2026, win: arm64, cpu: true, cpuflags: '-DGGML_CPU=ON', targets: 'llama ggml-base ggml-cpu' }
    steps:
      - uses: actions/checkout@v4

      - name: The patched source
        shell: bash
        run: ./scripts/build-libs.sh --prepare-only

      # The armv9.2 variants use -march=...+sme, which GCC 13 (the runner's) does not know.
      - name: GCC 14 (linux_arm64)
        if: ${{ matrix.target == 'linux_arm64' }}
        run: sudo apt-get install -y gcc-14 g++-14

      - name: Build (Unix)
        if: ${{ !matrix.win }}
        run: |
          cmake -S .cache/llama.cpp/src -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='${{ matrix.rpath }}' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            ${{ matrix.extra }} $CMAKE_FLAGS ${{ matrix.cpuflags }}
          cmake --build build --config Release --target ${{ matrix.targets }} -j 4

      # Patch 0006 is in ggml-vulkan: this target ships our ggml-vulkan.dll (the SDK version is the one of upstream's release job).
      - name: Vulkan SDK (Windows x64)
        if: ${{ matrix.vulkan }}
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Build (Windows)
        if: ${{ matrix.win }}
        shell: cmd
        run: |
          choco install ninja -y
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.win == 'x64' && 'x64' || 'amd64_arm64' }}
          cmake -S .cache/llama.cpp/src -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/${{ matrix.win }}-windows-llvm.cmake ^
            -DGGML_OPENMP=ON -DGGML_OPENMP_FETCH=ON ${{ matrix.cpuflags }} ^
            %CMAKE_FLAGS%
          cmake --build build --config Release --target ${{ matrix.targets }}

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find build -type f -o -type l | grep -E '/(lib)?(llama|ggml-base|ggml-vulkan|ggml-cpu[-.0-9a-z_]*|omp)[.0-9a-z]*\.(so|dylib|dll)[.0-9]*$' | while read -r f; do cp -P "$f" out/; done
          ls -l out
          test -n "$(ls out)" || { echo "no libraries were built" >&2; exit 1; }
          if [ "${{ matrix.cpu }}" = true ]; then
            ls out | grep -q '^\(lib\)\?ggml-cpu' || { echo "no CPU variants were built" >&2; exit 1; }
          fi
          tar -czf "nanollm-libs-${{ matrix.target }}.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: nanollm-libs-${{ matrix.target }}
          path: nanollm-libs-${{ matrix.target }}.tar.gz

  # Our ggml-cuda.dll (patches/llama.cpp, the "cuda:" subjects) and the CUDA runtime it needs, for two toolkits as
  # upstream's release does: 12.4 (drivers 525+, Maxwell and newer: nanollm-libs-windows_amd64_cuda) and 13.4
  # (driver 580+, Turing and newer: nanollm-libs-windows_amd64_cuda13). MSVC is the host compiler (nvcc takes no clang):
  # VS 2022 on windows-2022 as upstream's job; the toolkits are installed from NVIDIA's redistributable zips, which is
  # what upstream's windows-setup-cuda action does. CMAKE_CUDA_ARCHITECTURES is left to ggml/src/ggml-cuda/CMakeLists.txt.
  build-cuda:
    name: ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows_amd64_cuda, cuda: '12.4', defines: '-DGGML_CUDA_CCCL_VERSION=v3.4.3' }
          - { target: windows_amd64_cuda13, cuda: '13.4', defines: '-DGGML_CUDA_CCCL_VERSION=v3.4.3' }
    steps:
      - uses: actions/checkout@v4

      - name: The patched source
        shell: bash
        run: ./scripts/build-libs.sh --prepare-only

      - name: CUDA Toolkit ${{ matrix.cuda }}
        shell: pwsh
        run: |
          $v = '${{ matrix.cuda }}'
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$v"
          # name, version of the redistributable archive (upstream's windows-setup-cuda action)
          $parts = if ($v -eq '12.4') { @(
              @('cuda_cudart', '12.4.127'), @('cuda_nvcc', '12.4.131'), @('cuda_nvrtc', '12.4.127'),
              @('libcublas', '12.4.5.8'), @('cuda_nvtx', '12.4.127'), @('cuda_profiler_api', '12.4.127'),
              @('visual_studio_integration', '12.4.127'), @('cuda_cccl', '12.4.127')) } else { @(
              @('cuda_crt', '13.4.59'), @('cuda_cudart', '13.4.49'), @('cuda_nvcc', '13.4.59'), @('cuda_nvrtc', '13.4.59'),
              @('libcublas', '13.7.0.27'), @('libnvvm', '13.4.59'), @('cuda_nvtx', '13.4.49'),
              @('cuda_profiler_api', '13.4.49'), @('visual_studio_integration', '13.4.49'), @('cccl', '13.3.4.2.1')) }
          New-Item -ItemType Directory -Force $root | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'cudazips'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          foreach ($p in $parts) {
              $name = "$($p[0])-windows-x86_64-$($p[1])-archive"
              curl.exe -fsSL -o "$tmp\$name.zip" "https://developer.download.nvidia.com/compute/cuda/redist/$($p[0])/windows-x86_64/$name.zip"
              if ($LASTEXITCODE -ne 0) { throw "download of $name failed" }
              Expand-Archive "$tmp\$name.zip" -DestinationPath $tmp -Force
              Copy-Item "$tmp\$name\*" $root -Recurse -Force
          }
          Add-Content $env:GITHUB_PATH "$root\bin"
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$root"

      - name: Build
        shell: cmd
        run: |
          choco install ninja -y
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S .cache/llama.cpp/src -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_CUDA=ON ${{ matrix.defines }} ^
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_OPENSSL=OFF
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build\bin\Release\ggml-cuda.dll out\
          foreach ($d in "$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\lib") {
              foreach ($n in 'cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll') {
                  Get-ChildItem -Path (Join-Path $d $n) -ErrorAction SilentlyContinue | Copy-Item -Destination out\ -Force
              }
          }
          Get-ChildItem out | Format-Table Name, Length
          foreach ($n in 'ggml-cuda.dll', 'cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll') {
              if (-not (Get-ChildItem out -Filter $n)) { throw "no $n in the CUDA archive" }
          }
          tar -czf "nanollm-libs-${{ matrix.target }}.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: nanollm-libs-${{ matrix.target }}
          path: nanollm-libs-${{ matrix.target }}.tar.gz

  publish:
    needs: [build, build-cuda]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release llama-<tag>-n<N>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=$(tr -d '[:space:]' < scripts/libs.release)
          (cd assets && sha256sum nanollm-libs-*.tar.gz | tee ../libs-own.sha256)
          gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --title "$rel" \
            --notes "NanoLLM's libllama and libggml-base (and the CPU variants of the targets that build them): llama.cpp $(cat scripts/llama.cpp.tag) plus patches/llama.cpp. Put their sha256 (libs-own.sha256) in scripts/libs.sha256."
          gh release upload "$rel" assets/nanollm-libs-*.tar.gz libs-own.sha256 --clobber
