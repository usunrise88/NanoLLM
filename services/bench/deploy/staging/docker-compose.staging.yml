# Staging on hyper: ../docker-compose.yml plus this file, started by
# scripts/staging-bench-service.sh up. The host's own Caddy owns ports 80
# and 443 (nano.llmto.day.caddy next to this file), so only benchd and the static
# site run, and both are published on the loopback.
#
#   BENCHD_ADMIN_TOKEN=x docker compose -f ../docker-compose.yml -f docker-compose.staging.yml config
#
# The ports are fixed: 27418 (benchd) and 27419 (the static site), below the
# ephemeral range (32768-60999) so that an outgoing connection never takes
# them; the same numbers are in nano.llmto.day.caddy and in the script. Change
# all three or none.
name: nanollm-bench-staging

services:
  benchd:
    ports:
      - "127.0.0.1:27418:8080"

  # The static site (site/, built by `scripts/staging-bench-service.sh site`):
  # a small Caddy that serves site/dist read-only on the loopback.
  site:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27419:80"
    volumes:
      - ./staging/Caddyfile.site:/etc/caddy/Caddyfile:ro
      - ../../../site/dist:/srv:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The bundled Caddy is for a host without one; here it stays off (it would
  # take ports 80 and 443 from the system Caddy).
  caddy:
    profiles: ["bundled-caddy"]
